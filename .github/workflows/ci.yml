name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff
        run: ruff check horizonlink tests experiments

      - name: Pytest
        run: pytest

  dashboard-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dashboard
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dashboard]"

      - name: Import dashboard
        run: python -c "import horizonlink.dashboard as dashboard; assert callable(dashboard.main)"

      - name: Boot dashboard and check health
        shell: bash
        run: |
          python -m streamlit run horizonlink/dashboard.py \
            --server.headless true \
            --server.port 8501 \
            > streamlit.log 2>&1 &
          STREAMLIT_PID=$!
          trap 'kill $STREAMLIT_PID 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://localhost:8501/_stcore/health; then
              exit 0
            fi
            sleep 1
          done
          cat streamlit.log
          exit 1
