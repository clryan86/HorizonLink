name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff
        run: ruff check horizonlink tests experiments

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Pytest
        run: pytest

  package-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Build wheel and source distribution
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Install built wheel
        shell: bash
        run: |
          WHEEL=$(find dist -maxdepth 1 -name 'horizonlink-*.whl' -print -quit)
          test -n "$WHEEL"
          python -m pip install "$WHEEL"

      - name: Smoke-test installed package outside checkout
        shell: bash
        run: |
          cd /tmp
          horizonlink radius 1 > horizonlink-radius.json
          python - <<'PY'
          import importlib.metadata as metadata
          import json
          import horizonlink

          with open("/tmp/horizonlink-radius.json", encoding="utf-8") as handle:
              payload = json.load(handle)
          assert 2900.0 < payload["schwarzschild_radius_m"] < 3000.0
          assert horizonlink.__version__ == metadata.version("horizonlink")
          PY

  dashboard-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dashboard
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dashboard]"

      - name: Import dashboard
        run: python -c "import horizonlink.dashboard as dashboard; assert callable(dashboard.main)"

      - name: Boot dashboard and check health
        shell: bash
        run: |
          python -m streamlit run horizonlink/dashboard.py \
            --server.headless true \
            --server.port 8501 \
            > streamlit.log 2>&1 &
          STREAMLIT_PID=$!
          trap 'kill $STREAMLIT_PID 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://localhost:8501/_stcore/health; then
              exit 0
            fi
            sleep 1
          done
          cat streamlit.log
          exit 1
