[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "horizonlink"
version = "0.4.0"
description = "Research sandbox for horizon and information-channel experiments"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Christopher Ryan"}]
dependencies = [
  "numpy>=1.24",
]

[project.scripts]
horizonlink = "horizonlink.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]
viz = [
  "matplotlib>=3.8",
]
dashboard = [
  "pandas>=2.0",
  "streamlit>=1.40",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.setuptools.packages.find]
include = ["horizonlink*"]
